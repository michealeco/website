# Shared ngrok → Nginx :8088
#   /        → Eco Fam Vault   :3000
#   /chorus/ → Chorus media    :4050
#
# Put on the Ubuntu server, e.g. /etc/nginx/sites-available/fam-gateway
# Then: sudo ln -s .../fam-gateway /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Point ngrok at Nginx, NOT at Vault directly:
#   ngrok http 8088 --url=smirk-keep-undone.ngrok-free.dev

server {
    listen 8088;
    server_name _;

    # Photo uploads can be large
    client_max_body_size 60m;

    # Chorus karaoke media API (keep trailing slash behavior)
    location /chorus/ {
        proxy_pass http://127.0.0.1:4050/chorus/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 0;
    }

    # Eco Fam Vault (everything else: /, /api, /media)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
